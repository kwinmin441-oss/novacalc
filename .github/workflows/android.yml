```yaml
name: NovaCalc Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --org com.novacalc --platforms=android .

      - name: Fix Android Gradle Plugin
        run: |
          grep -n 'com.android.application' android/settings.gradle
          sed -i 's/9\.3\.1/9.3.2/g' android/settings.gradle
          grep -n 'com.android.application' android/settings.gradle

      - name
